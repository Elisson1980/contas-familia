<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contas da Família</title>
<meta name="theme-color" content="#0E1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Família">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#0E1116; --s1:#131820; --s2:#151A21; --s3:#181E26; --tab:#11151B;
  --b1:#232A33; --b2:#333A44; --b3:#4E545D;
  --t1:#EDE6D6; --t2:#CFC7B6; --t3:#9A9384;
  --ouro:#C9A96A; --ouro2:#E3D3AE; --escuro:#14110B;
  --num:'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
  --txt:'IBM Plex Sans', system-ui, -apple-system, sans-serif;
  --topo: env(safe-area-inset-top, 0px);
  --base: env(safe-area-inset-bottom, 0px);
  --abas: calc(64px + var(--base));
  color-scheme: dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--t1);font-family:var(--txt);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
/* app ocupa a tela inteira; só o conteúdo rola; a barra de abas fica sempre no rodapé (sem position:fixed) */
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ouro);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-0.02em}
.rot{font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--t3)}
.ouro{color:var(--ouro)} .ouro2{color:var(--ouro2)} .t2{color:var(--t2)} .t3{color:var(--t3)}
.oculto-privacidade #app{filter:blur(24px)}

/* ---------- estrutura ---------- */
.tela{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:calc(var(--topo) + 8px) max(16px, calc((100% - 560px) / 2)) 24px;display:flex;flex-direction:column;gap:16px}
.tela.fixa{overflow:hidden;padding-bottom:12px}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.ola{display:flex;align-items:center;gap:12px;font-family:var(--num);font-weight:600;font-size:18px}
.icone{width:44px;height:44px;border-radius:14px;border:1px solid var(--b1);background:var(--s1);display:grid;place-items:center;padding:0;flex:none}
.icone svg{width:20px;height:20px}
.abas{flex:none;position:relative;height:var(--abas);padding:0 8px var(--base);background:var(--tab);border-top:1px solid var(--b1);display:grid;grid-template-columns:repeat(3,1fr);z-index:20}
.abas a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:500;color:var(--t3);min-height:44px}
.abas a[aria-current="page"]{color:var(--ouro)}
.abas svg{width:22px;height:22px}

/* ---------- avatar e banco ---------- */
.av{border-radius:50%;background:var(--s3);border:1px solid var(--b2);display:grid;place-items:center;font-family:var(--num);font-weight:600;color:var(--t1);overflow:hidden;flex:none;position:relative}
.av img{width:100%;height:100%;object-fit:cover}
.av-duplo{display:flex;flex:none}
.av-duplo .av + .av{margin-left:-14px;box-shadow:0 0 0 2px var(--s2)}
.banco{flex:none;border:1px dashed var(--b3);border-radius:8px;display:grid;place-items:center;text-align:center;font-size:10px;line-height:12px;color:var(--t3);padding:4px 6px;min-height:30px}
.banco img{max-height:26px;max-width:100%;display:block}
.banco.tem-logo{border:0;padding:0}
.selo{display:inline-flex;align-items:center;height:20px;padding:0 8px;border:1px solid var(--ouro);color:var(--ouro);border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.04em}

/* ---------- total ---------- */
.total{display:flex;flex-direction:column;gap:6px}
.total .valor{display:flex;align-items:baseline;gap:6px;line-height:1}
.total .valor small{font-family:var(--num);font-size:20px;font-weight:600;color:var(--t2)}
.total .valor span{font-size:38px;font-weight:700}
.total .var{font-size:13px;font-weight:500;color:var(--ouro)}

/* ---------- visão Lista ---------- */
.lista{flex:1;min-height:0;display:grid;grid-auto-rows:minmax(150px,1fr);gap:12px;overflow:auto;padding-bottom:2px}
.card{background:var(--s2);border:1px solid var(--b1);border-radius:20px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:0}
.card.meu{border-color:var(--b2);background:linear-gradient(180deg,var(--s3),var(--s2))}
.card-topo{display:flex;align-items:center;gap:12px}
.card-id{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.card-id b{font-family:var(--num);font-weight:600;font-size:17px;display:flex;align-items:center;gap:8px}
.card-id small{font-size:12px;color:var(--t3);font-variant-numeric:tabular-nums}
.card-base{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.card-base .inv{font-size:12px;color:var(--t2);margin-bottom:2px}
.card-base .saldo{font-size:28px;font-weight:700;line-height:1.1}
.card-base .saldo.zero{color:var(--t2)}
.card-base .tx{text-align:right;display:flex;flex-direction:column;gap:2px;font-family:var(--num);font-weight:600;font-size:13px;color:var(--ouro2);white-space:nowrap}
.card-base .tx small{font-family:var(--txt);font-weight:500;font-size:12px;color:var(--ouro)}
.card .vazio{font-size:12px;color:var(--t3)}
.card-base .tx small.t3{color:var(--t3)}

/* ---------- visão Barras (pilares) ---------- */
.painel{background:var(--s2);border:1px solid var(--b1);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:12px}
.painel-topo{display:flex;justify-content:space-between;align-items:center}
.pilares{flex:1 0 auto}
.grade3{flex:1 0 auto;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pilar{min-height:430px;border:1px solid var(--b2);border-radius:12px;background:var(--s1);display:flex;flex-direction:column;overflow:hidden}
.pilar .p-cab{padding:10px 9px;display:flex;flex-direction:column;gap:6px}
.pilar .p-linha{display:flex;justify-content:space-between;align-items:center}
.pilar .p-num{font-family:var(--num);font-size:12px;font-weight:600;color:var(--t3)}
.pilar .p-nome{font-family:var(--num);font-weight:600;font-size:15px;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pilar .p-papel{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--t3)}
.pilar .p-papel.eu{color:var(--ouro)}
.pilar .banco{width:100%}
.pilar .p-ag{font-size:11px;line-height:14px;color:var(--t3);font-variant-numeric:tabular-nums}
.pilar .p-meio{border-top:1px solid var(--b2);padding:8px 9px;display:flex;flex-direction:column;gap:4px}
.pilar .p-saldo{font-size:16px;font-weight:700;line-height:1.1;white-space:nowrap}
.pilar .p-tx{border-top:1px solid var(--b2);padding:7px 9px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.pilar .p-tx b{font-family:var(--num);font-weight:600;color:var(--ouro2)}
.pilar .p-tx span{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pilar .p-barra{flex:1;min-height:90px;position:relative;border-top:1px solid var(--b2);background:var(--s1)}
.pilar .p-fill{position:absolute;left:0;right:0;bottom:0;background:var(--ouro)}
.pilar .p-pct{position:absolute;left:9px;right:9px;bottom:9px;display:flex;flex-direction:column;gap:2px}
.pilar .p-pct b{font-family:var(--num);font-size:24px;font-weight:700;line-height:1}
.pilar .p-pct small{font-size:11px}
.pilar .p-pct.claro b{color:var(--t2)} .pilar .p-pct.claro small{color:var(--t3)}
.pilar .p-pct.escuro b,.pilar .p-pct.escuro small{color:var(--escuro)}

/* ---------- visão Órbita ---------- */
.orbita{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 0}
.orbita::before{content:"";position:absolute;left:50%;top:50%;width:min(92vw,470px);height:min(92vw,470px);transform:translate(-50%,-50%);border:1px dashed var(--b2);border-radius:50%;pointer-events:none}
.orbita .sat{position:relative;background:var(--s2);border:1px solid var(--b1);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:6px;min-height:176px}
.orbita .sat.meu{border-color:var(--b2)}
.orbita .sat.baixo{grid-column:1 / span 2;justify-self:center;width:calc(50% - 6px)}
.orbita .centro{grid-column:1 / span 2;justify-self:center;position:relative;width:200px;height:200px;display:grid;place-items:center;text-align:center}
.orbita .centro svg{position:absolute;inset:0}
.sat .s-saldo{font-size:20px;font-weight:700}
.sat .s-inv{font-size:11px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- conta ---------- */
.volta{display:flex;align-items:center;gap:12px}
.volta .nome{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.volta .nome b{font-family:var(--num);font-weight:600;font-size:18px}
.volta .nome small{font-size:12px;color:var(--t3)}
.grande{font-size:42px;font-weight:700;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--b2);display:inline-flex;align-items:center;font-size:12px;font-weight:500;color:var(--t2);font-variant-numeric:tabular-nums}
.chip.ouro{border-color:rgba(201,169,106,.5);color:var(--ouro)}
.botoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{height:52px;border-radius:14px;border:1px solid var(--b2);background:transparent;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.prim{background:var(--ouro);border-color:var(--ouro);color:var(--escuro)}
.btn.bloco{width:100%}
.btn:disabled{opacity:.5}
.grafico{background:var(--s2);border:1px solid var(--b1);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.grafico svg{width:100%;height:auto;display:block}
.extrato{display:flex;flex-direction:column;gap:6px}
.mes{margin:10px 0 2px}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--b1)}
.item .ic{width:36px;height:36px;border-radius:12px;background:var(--s2);border:1px solid var(--b1);display:grid;place-items:center;flex:none}
.item .ic svg{width:18px;height:18px}
.item .d{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item .d b{font-weight:500;font-size:14px}
.item .d small{font-size:12px;color:var(--t3)}
.item .v{font-family:var(--num);font-weight:600;font-size:15px;white-space:nowrap;text-align:right}
.item .v.mais{color:var(--ouro)} .item .v.menos{color:var(--t2)}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--t3);font-size:12px;text-decoration:underline}
.vazio-bloco{padding:28px 16px;text-align:center;color:var(--t3);font-size:14px;border:1px dashed var(--b2);border-radius:16px}

/* ---------- família ---------- */
.inv-linha{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--b1)}
.inv-linha:last-child{border-bottom:0}
.inv-linha .d{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.inv-linha .d b{font-family:var(--num);font-weight:600;font-size:15px}
.inv-linha .d small{font-size:12px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.part{height:4px;border-radius:2px;background:var(--b1);overflow:hidden}
.part i{display:block;height:100%;background:var(--ouro)}
.inv-linha .v{text-align:right;display:flex;flex-direction:column;gap:2px}
.inv-linha .v b{font-family:var(--num);font-weight:600;font-size:15px}
.inv-linha .v small{font-size:12px;color:var(--ouro2)}

/* ---------- perfil ---------- */
.perfil-cab{display:flex;align-items:center;gap:16px}
.secao{background:var(--s2);border:1px solid var(--b1);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:14px}
.secao h2{margin:0;font-family:var(--num);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:8px}
.visoes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.visao{border:1px solid var(--b2);border-radius:14px;background:var(--s1);padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--t2)}
.visao[aria-pressed="true"]{border-color:var(--ouro);color:var(--ouro)}
.visao svg{width:64px;height:84px}
.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:12px;font-weight:500;color:var(--t2)}
.campo input{height:48px;border-radius:12px;border:1px solid var(--b2);background:var(--s1);padding:0 14px;font-size:16px;color:var(--t1);width:100%}
.campo input:focus{border-color:var(--ouro);outline:none}
.campo .ajuda{font-size:12px;color:var(--t3)}
.dupla{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.linha-sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.linha-sw span{display:flex;flex-direction:column;gap:2px;font-size:15px}
.linha-sw small{font-size:12px;color:var(--t3)}
.sw{width:52px;height:32px;border-radius:999px;border:1px solid var(--b2);background:var(--s1);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--t3);transition:transform .15s}
.sw[aria-checked="true"]{background:var(--ouro);border-color:var(--ouro)}
.sw[aria-checked="true"]::after{transform:translateX(20px);background:var(--escuro)}
.sw:disabled{opacity:.4}

/* ---------- login ---------- */
.login{flex:1;min-height:0;overflow-y:auto;width:100%;padding:calc(var(--topo) + 28px) 20px calc(var(--base) + 24px);display:flex;flex-direction:column;gap:22px;max-width:520px;margin:0 auto}
.login h1{margin:0;font-family:var(--num);font-size:32px;font-weight:700;letter-spacing:-0.02em}
.login p{margin:0;color:var(--t2);font-size:15px}
.login > *{flex-shrink:0}
.tiles{flex:1 0 auto;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(2,minmax(220px,1fr));gap:12px}
.tile{height:100%;min-height:0;border-radius:20px;background:var(--s2);border:1px solid var(--b1);display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;padding:18px 12px 16px;text-align:center}
.tile .t-id{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.tile .banco{width:min(120px,100%);min-height:40px}
.tile .banco img{max-height:38px}
.tile.ultimo{border-color:var(--ouro)}
.tile b{font-family:var(--num);font-weight:600;font-size:16px;line-height:1.2}
.tile small{font-size:12px;color:var(--t3)}
.login .rodape{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.login .rodape small{font-size:13px;color:var(--t3)}

/* ---------- sheet / toast ---------- */
.fundo{position:fixed;inset:0;background:rgba(8,10,13,.72);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--s2);border:1px solid var(--b2);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 20px calc(var(--base) + 20px);display:flex;flex-direction:column;gap:14px;max-height:92dvh;overflow:auto}
.sheet .alca{width:40px;height:4px;border-radius:2px;background:var(--b2);align-self:center}
.sheet h2{margin:0;font-family:var(--num);font-size:22px;font-weight:600}
.sheet p{margin:0;color:var(--t2);font-size:14px}
.erro{color:var(--ouro2);font-size:13px;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(var(--abas) + 16px);transform:translateX(-50%);background:var(--s3);border:1px solid var(--b2);color:var(--t1);padding:12px 16px;border-radius:14px;font-size:14px;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.demo{font-size:11px;color:var(--t3);text-align:center}
.pin-pontos{display:flex;justify-content:center;gap:12px;padding:6px 0}
.pin-pontos i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--b3)}
.pin-pontos i.on{background:var(--ouro);border-color:var(--ouro)}
.teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tecla{height:60px;border-radius:16px;border:1px solid var(--b1);background:var(--s1);font-family:var(--num);font-size:24px;font-weight:600;color:var(--t1);display:grid;place-items:center;padding:0}
.tecla:active{background:var(--s3);border-color:var(--b2)}
.tecla:disabled{opacity:.5}
.carregando{flex:1;display:grid;place-items:center;color:var(--t3)}
</style>
</head>
<body>
<div id="app"><div class="carregando">Carregando…</div></div>
<div id="camada"></div>
<script type="module" src="app.js"></script>
</body>
</html>
